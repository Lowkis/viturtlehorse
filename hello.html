<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web đơn giản</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 24px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chào mừng!</h1>
    </header>

    <main>
        <h2>Đây là trang web đơn giản</h2>
        <p>Nhấn nút bên dưới để bắt đầu.</p>
        <button id="helloButton">Xin chào</button>
        <p>phuonghello</p>
    </main>

    <script>
        document.getElementById("helloButton").addEventListener("click", function () {
            alert("Xin chào! Chúc bạn một ngày tốt lành.");
        });
    </script>
</body>
</html>
